name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に続けて push したら、古い方の実行を止める。main への push は止めない
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ブラウザと OS の部品が入った Playwright のイメージで動かす。
    # 版は package.json の @playwright/test とそろえる（ずれるとブラウザが見つからずに落ちる）
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    env:
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # パッケージの中のコードを動かす前に、npm に公開されたものと同じかを確かめるため、スクリプトを止めて入れる
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run prepare
      - run: npm run check
      - run: npm run lint
      - run: npm test

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    # --test の実行には --metrics=off を付けられないので、計測を入れない決まり（AGENTS.md）を環境の変数で守る
    env:
      SEMGREP_SEND_METRICS: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep --test --config .semgrep/d1.yml .semgrep/d1.ts
      - run: semgrep --test --config .semgrep/hidden-characters.yml .semgrep/hidden-characters.txt
      # .semgrep/ の中は、わざと穴を書いたルールのテスト。
      # --metrics=off は、使われ方の計測を入れないと決めているため（AGENTS.md）
      - run: semgrep scan --config p/owasp-top-ten --config .semgrep/d1.yml --config .semgrep/hidden-characters.yml --exclude .semgrep --metrics=off --error
